name: deploy-site
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # Daily at 2:00 AM Manila time so 14-day auto-delete stays exact
  push:
    branches: [main]
    paths: ["config.json", "processor/build.py", "processor/copy_scans.py", "processor/owner.html", "processor/pages.py", "processor/exam_page.py", "processor/exam_results.py", "processor/upcoming.py"]
permissions: { contents: read }
concurrency: { group: site, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r processor/requirements.txt
      - run: python processor/build.py
      - name: Add the page images of live releases to the site
        run: python processor/copy_scans.py
      - run: head -c 600 site/sitemap.xml; echo; echo "loc count:"; grep -o "<loc>" site/sitemap.xml | wc -l
      - name: Deploy to Cloudflare Pages (3 tries)
        run: |
          for i in 1 2 3; do
            if npx --yes wrangler@3 pages deploy site --project-name=ph-exam-result --branch=main; then exit 0; fi
            echo "deploy attempt $i failed"
            sleep $((i * 10))
          done
          echo "::error::Cloudflare Pages deploy failed 3 times"; exit 1
