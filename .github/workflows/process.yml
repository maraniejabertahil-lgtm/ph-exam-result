name: process-prc-article
on:
  repository_dispatch: { types: [prc] }       # sent by the Cloudflare Worker within seconds of detection
  workflow_dispatch:
    inputs: { url: { description: "PRC article URL", required: true } }
permissions: { contents: write }
concurrency: { group: site, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      URL: ${{ github.event.client_payload.url || inputs.url }}
      DETECTED_AT: ${{ github.event.client_payload.detected_at }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - run: python processor/process.py
      - run: python processor/build.py
      - name: Deploy to Cloudflare Pages (free)
        run: npx --yes wrangler@3 pages deploy site --project-name=ph-exam-result --branch=main
      - run: python processor/notify.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data; git diff --cached --quiet || (git commit -m "auto: $URL" && git push)
