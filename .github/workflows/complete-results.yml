name: complete-results

on:
  workflow_run:
    workflows: ["process-prc-article"]
    types: [completed]

permissions: { contents: write, actions: read }

concurrency: { group: complete-results, cancel-in-progress: false }

jobs:
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      mode: ${{ steps.p.outputs.mode }}
    steps:
      - name: Wait 3 minutes after the current pipeline finished
        run: sleep 180
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - name: Read the first pipeline's alert for the run that just finished
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: job
          path: processor/alert
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: p
        run: python complete_prepare.py
        working-directory: processor
      - uses: actions/upload-artifact@v4
        if: ${{ steps.p.outputs.mode == 'screens' }}
        with: { name: links, path: processor/work/links.json }

  capture:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - name: Install packages and Chromium
        run: |
          pip install -q -r processor/requirements.txt playwright==1.49.0
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: links, path: processor/work }
      - name: Capture full-resolution page images
        run: python complete.py
        working-directory: processor
        timeout-minutes: 25
      - name: Save images and data to main
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data scans
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "auto: page images for the current release"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep $((i * 2))
          done
          echo "::error::could not push the images"; exit 1

  deploy:
    needs: capture
    if: ${{ always() && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: site, cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - run: python processor/build.py
      - name: Copy the page images into the site
        run: cp -r scans site/ || true
      - run: npx --yes wrangler@3 pages deploy site --project-name=ph-exam-result --branch=main
