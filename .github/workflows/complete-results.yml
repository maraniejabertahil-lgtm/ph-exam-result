name: complete-results

# Pipeline 2 (page images). It starts only after pipeline 1 has completely finished, deployed and announced,
# so it can never delay pipeline 1's result. It also never takes more than a few runner slots at once
# (max-parallel), so the next release's 20 pipeline-1 shards are not left waiting for a free runner.
# GitHub never contacts PRC: the list links come from the Cloudflare Worker through pipeline 1's alert file.

on:
  workflow_run:
    workflows: ["process-prc-article"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Pipeline 1 (process-prc-article) run ID to test"
        required: true
      dry_run:
        description: "Skip git push, Cloudflare deploy, and notifications"
        type: boolean
        default: true

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}

permissions: { contents: write, actions: read }

concurrency: { group: complete-results, cancel-in-progress: false }

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.p.outputs.mode }}
      total: ${{ steps.plan.outputs.total }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt playwright==1.49.0
      - name: Read the first pipeline's alert for the run that just finished
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: job
          path: processor/alert
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: p
        run: python complete_prepare.py
        working-directory: processor
      - name: Use the runner's Chrome (Chromium is installed only if Chrome is missing)
        if: ${{ steps.p.outputs.mode == 'screens' }}
        run: command -v google-chrome >/dev/null 2>&1 || python -m playwright install --with-deps chromium
      - id: plan
        name: Plan the scroll positions and how many shard jobs this list needs
        if: ${{ steps.p.outputs.mode == 'screens' }}
        run: python complete.py plan
        working-directory: processor
        timeout-minutes: 5
      - uses: actions/upload-artifact@v4
        if: ${{ steps.p.outputs.mode == 'screens' }}
        with: { name: pipeline2, path: "processor/work/*.json", if-no-files-found: error }

  shards:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: { shard: "${{ fromJSON(needs.prepare.outputs.matrix) }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt playwright==1.49.0
      - run: command -v google-chrome >/dev/null 2>&1 || python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: pipeline2, path: processor/work }
      - run: python complete.py shard ${{ matrix.shard }} ${{ needs.prepare.outputs.total }}
        working-directory: processor
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with: { name: "part-${{ matrix.shard }}", path: "processor/work/captures/*.webp", if-no-files-found: ignore }

  gaps:
    needs: [prepare, shards]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      need: ${{ steps.g.outputs.need }}
      k: ${{ steps.g.outputs.k }}
      matrix: ${{ steps.g.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: pipeline2, path: processor/work }
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: processor/work/captures, merge-multiple: true }
      - id: g
        name: Which page positions has nobody captured? How many fill jobs?
        run: python complete.py check
        working-directory: processor
      - uses: actions/upload-artifact@v4
        with: { name: missing, path: processor/work/missing.json }

  fill:
    needs: [prepare, gaps]
    if: ${{ always() && needs.gaps.result == 'success' && needs.gaps.outputs.need == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: { shard: "${{ fromJSON(needs.gaps.outputs.matrix) }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt playwright==1.49.0
      - run: command -v google-chrome >/dev/null 2>&1 || python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: pipeline2, path: processor/work }
      - uses: actions/download-artifact@v4
        with: { name: missing, path: processor/work }
      - name: Capture this fill job's share of the missing pages
        run: python complete.py fill ${{ matrix.shard }} ${{ needs.gaps.outputs.k }}
        working-directory: processor
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        with: { name: "part-fill-${{ matrix.shard }}", path: "processor/work/captures/*.webp", if-no-files-found: ignore }

  extras:
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'screens' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt playwright==1.49.0
      - run: command -v google-chrome >/dev/null 2>&1 || python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: pipeline2, path: processor/work }
      - name: Capture the schools and top-notchers pages
        run: python complete.py extras
        working-directory: processor
        timeout-minutes: 25
      - name: Save these pages to main (retries if another run pushed at the same moment)
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data scans
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "auto: schools and top-notchers pages"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          echo "::error::could not push the extra pages"; exit 1

  # Runs after 'extras' (so the two never edit the same data file at the same time), whether extras worked or not:
  # the names images must never be lost because the schools or top-notchers page failed.
  finish:
    needs: [prepare, shards, gaps, fill, extras]
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'screens' && needs.gaps.result == 'success' && (needs.extras.result == 'success' || needs.extras.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      slug: ${{ steps.f.outputs.slug }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: pipeline2, path: processor/work }
      - uses: actions/download-artifact@v4
        with: { pattern: "part-*", path: processor/work/captures, merge-multiple: true }
      - id: f
        name: Merge the page images and remove repeats
        run: python complete.py finish
        working-directory: processor
      - name: Save the images to main (retries if another run pushed at the same moment)
        env:
          SLUG: ${{ steps.f.outputs.slug }}
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data scans
          if git diff --cached --quiet; then echo "nothing new to save"; exit 0; fi
          git commit -m "auto: page images $SLUG"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          echo "::error::could not push the images"; exit 1

  publish:
    needs: [finish]
    if: ${{ always() && needs.finish.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: site, cancel-in-progress: false }
    env:
      SLUG: ${{ needs.finish.outputs.slug }}
      PIPELINE: "2"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_WEBHOOK_URL: ${{ secrets.FB_WEBHOOK_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: processor/requirements.txt }
      - run: pip install -r processor/requirements.txt
      - run: python processor/build.py
      - name: Add the page images of live releases to the site
        run: python processor/copy_scans.py
      - name: Deploy to Cloudflare Pages (3 tries)
        run: |
          for i in 1 2 3; do
            if npx --yes wrangler@3 pages deploy site --project-name=ph-exam-result --branch=main; then exit 0; fi
            echo "deploy attempt $i failed"
            sleep $((i * 10))
          done
          echo "::error::Cloudflare Pages deploy failed 3 times"; exit 1
      - run: python processor/notify.py
      - name: Save the release log (serialized by the site lock; the site is already live, so this never fails the run)
        if: ${{ always() }}
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A data
          if git diff --cached --quiet; then echo "no release log change"; exit 0; fi
          git commit -m "auto: release log $SLUG"
          for i in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 2))
          done
          echo "::warning::could not save the release log (the site is already live)"
