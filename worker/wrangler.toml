name = "ph-exam-result-watcher"
main = "index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]          # free plan allows this; the Worker only does tiny, cheap work

[[kv_namespaces]]
binding = "KV"
id = "3c22c1aa00684e118ed4618f17232940"

[vars]
GITHUB_REPO = "https://github.com/maraniejabertahil-lgtm/ph-exam-result"
WATCH = ""                      # empty = every exam; or "veterinarians,nurses"
SITE_URL = "https://ph-exam-result.pages.dev"
FIREBASE_PROJECT_ID = "ph-exam-result"

# Optional: route phexamresult.com/owner* to this Worker (Pages serves everything else)
# routes = [{ pattern = "https://ph-exam-result.pages.dev/owner*", zone_name = "phexamresult.com" }]
